<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ON AlAA STORE" />
    <meta name="theme-color" content="#0A0F1D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#007AFF" media="(prefers-color-scheme: light)" />
    <meta name="format-detection" content="telephone=no" />
    <title>ON AlAA STORE | Online Tech Store Lebanon</title>
    <meta name="description" content="ON AlAA STORE — Online Tech Store based in Chouf with fast delivery available to all Lebanon. Smartphones, laptops, gaming gear, smart accessories, and premium tech." />
    <meta property="og:title" content="ON AlAA STORE | Online Tech Store Lebanon" />
    <meta property="og:description" content="ON AlAA STORE — Online Tech Store based in Chouf with fast delivery available to all Lebanon. Smartphones, laptops, gaming gear, smart accessories, and premium tech." />
    <link rel="icon" type="image/svg+xml" href="/on-alaa-logo.svg" />
    <link rel="apple-touch-icon" href="/on-alaa-logo.svg" />
    <meta property="og:image" content="/on-alaa-logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/on-alaa-logo.svg" />
    <!-- High-priority preload for store logo to ensure instant LCP render -->
    <link rel="preload" as="image" href="/on-alaa-logo.svg" fetchpriority="high" />
    <!-- DNS prefetch & preconnect for external CDNs -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Asynchronous, non-render-blocking Google Fonts with display=swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    </noscript>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('arnaout_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();

      // Gracefully silence transient WebSocket and WebChannel proxy disconnects in embedded iframes
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = reason ? (reason.message || String(reason)) : '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('WebChannelConnection') !== -1 ||
          msg.indexOf('Listen stream transport errored') !== -1 ||
          msg.indexOf('failed to connect') !== -1
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="m-0 p-0 overflow-x-hidden w-full min-h-[100dvh] bg-[#FFFFFF] dark:bg-[#0A0F1D] text-[#172033] dark:text-[#F8FAFC] antialiased selection:bg-[#007AFF] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
