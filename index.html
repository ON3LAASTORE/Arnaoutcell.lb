<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ARNAOUT STORE" />
    <meta name="theme-color" content="#0A0F1D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#007AFF" media="(prefers-color-scheme: light)" />
    <meta name="format-detection" content="telephone=no" />
    <title>ARNAOUT STORE | Your Home in Electronics 🏠</title>
    <meta name="description" content="ARNAOUT STORE | Your Home in Electronics 🏠 - Lebanon's premier 2027 tech & electronics destination in Saida. Flagship smartphones, laptops, audio gear, and certified services." />
    <meta property="og:title" content="ARNAOUT STORE | Your Home in Electronics 🏠" />
    <meta property="og:description" content="ARNAOUT STORE | Your Home in Electronics 🏠 - Lebanon's premier 2027 tech & electronics destination in Saida." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('arnaout_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="m-0 p-0 overflow-x-hidden w-full min-h-[100dvh] bg-[#FFFFFF] dark:bg-[#0A0F1D] text-[#172033] dark:text-[#F8FAFC] antialiased selection:bg-[#007AFF] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
