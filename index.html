    <script>
      (function() {
        try {
          var saved = localStorage.getItem('arnaout_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var savedLang = localStorage.getItem('arnaout_lang');
          if (savedLang === 'ar') {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
            document.documentElement.classList.add('rtl');
            document.documentElement.classList.remove('ltr');
          } else {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
            document.documentElement.classList.add('ltr');
            document.documentElement.classList.remove('rtl');
          }
        } catch (e) {}
      })();

      // Gracefully silence transient Vite HMR WebSocket rejections from @vite/client before app bootstrap
      // without swallowing real React, Firebase Auth, Firestore, or application errors.
      (function() {
        function isViteHmrSocketNoise(msg, stack, filename) {
          var combined = (String(msg || '') + '\n' + String(stack || '') + '\n' + String(filename || '')).toLowerCase();
          if (!combined.trim()) return false;
          if (
            (combined.indexOf('firestore') !== -1 ||
              combined.indexOf('auth/') !== -1 ||
              combined.indexOf('permission-denied') !== -1) &&
            combined.indexOf('@vite/client') === -1
          ) {
            return false;
          }
          return (
            combined.indexOf('websocket closed without opened') !== -1 ||
            combined.indexOf('[vite] failed to connect to websocket') !== -1 ||
            (combined.indexOf('failed to connect to websocket') !== -1 && combined.indexOf('vite') !== -1) ||
            (combined.indexOf('@vite/client') !== -1 && combined.indexOf('websocket') !== -1)
          );
        }

        window.addEventListener(
          'unhandledrejection',
          function(event) {
            var reason = event && event.reason;
            var msg = reason ? (reason.message || String(reason)) : '';
            var stack = reason && reason.stack ? reason.stack : '';
            if (isViteHmrSocketNoise(msg, stack, '')) {
              event.preventDefault();
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function(event) {
            var err = event && event.error;
            var msg = (event && (event.message || (err && err.message))) || '';
            var stack = err && err.stack ? err.stack : '';
            var filename = (event && event.filename) || '';
            if (isViteHmrSocketNoise(msg, stack, filename)) {
              event.preventDefault();
            }
          },
          true
        );
      })();
